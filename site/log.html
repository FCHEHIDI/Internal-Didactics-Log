<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log — Internal Didactics Log</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Sans+Condensed:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>
<body class="page-entry">
  <canvas id="fractal-bg" aria-hidden="true"></canvas>

  <div class="site-wrapper">
    <nav class="nav-bar" role="navigation" aria-label="Main navigation">
      <a href="index.html" class="nav-logo" aria-label="IDL Home">IDL</a>
      <div class="nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <a href="log.html" class="nav-link active" aria-current="page">Log</a>
        <a href="contact.html" class="nav-link">Contact</a>
      </div>
    </nav>

    <header class="entry-hero" role="banner" id="top">
      <div class="container">
        <p id="article-date" class="hero-eyebrow">Published</p>
        <h1 id="article-title" class="hero-title">Loading article…</h1>
      </div>
    </header>

    <main id="main" class="container entry-content">
      <article class="entry-body">
        <figure class="entry-cover">
          <img id="article-cover" src="/assets/Backgrounds/EntryHeaderBackground.png" alt="Log cover">
        </figure>

        <p id="article-summary" class="card-abstract"></p>

        <div id="article-content"></div>

        <div id="article-links" class="media-grid"></div>

        <div class="entry-meta">
          <div class="meta-group">
            <span class="meta-label">Engagement</span>
            <div class="card-tags">
              <button id="like-btn" class="feed-btn" type="button">Like</button>
              <span id="like-count" class="meta-value">0</span>
            </div>
          </div>
          <div class="meta-group">
            <span class="meta-label">Tags</span>
            <div id="article-tags" class="card-tags"></div>
          </div>
        </div>

        <section class="section" aria-labelledby="comments-heading">
          <h2 id="comments-heading" class="section-title">Comments</h2>
          <form id="comment-form" class="admin-form">
            <div class="admin-field">
              <label for="comment-name">Name</label>
              <input id="comment-name" name="name" required>
            </div>
            <div class="admin-field admin-field-full">
              <label for="comment-content">Comment</label>
              <textarea id="comment-content" name="content" rows="3" required></textarea>
            </div>
            <button type="submit" class="feed-btn">Post comment</button>
            <span id="comment-status" class="feed-status" aria-live="polite"></span>
          </form>

          <div id="comments-list" class="admin-list" style="margin-top: 1rem;"></div>
        </section>
      </article>
    </main>

    <footer class="site-footer" role="contentinfo">
      <span>Internal Didactics Log</span>
      <a href="#top" class="footer-top">&uarr; Top</a>
    </footer>
  </div>

  <script src="js/fractal-bg.js"></script>
  <script src="js/config.js"></script>
  <script src="js/runtime.js"></script>
  <script src="js/article-page.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
